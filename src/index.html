<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost https://ipc.localhost; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
    <title>Fish翻译</title>
    <link rel="stylesheet" href="/styles/themes/default.css" />
    <link rel="stylesheet" href="/app.css" />
    <script src="/boot-head.js"></script>
  </head>
  <body>
    <!-- 实验：启动遮罩，颜色跟随主题；app.js 首屏渲染完成后淡出并移除 -->
    <div class="boot-cover" id="boot-cover" aria-hidden="true"></div>
    <div class="app">
      <div class="titlebar" data-tauri-drag-region>
        <span class="brand-dot" aria-hidden="true"></span>
        <span class="titlebar-title" data-tauri-drag-region>Fish翻译</span>
        <span class="titlebar-version" id="app-version" aria-label="版本号"></span>
        <div class="win-controls">
          <button type="button" class="win-btn" id="win-min" title="最小化" aria-label="最小化">
            <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M1 5h8" /></svg>
          </button>
          <button type="button" class="win-btn" id="win-max" title="最大化 / 还原" aria-label="最大化或还原">
            <svg class="icon-max" viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><rect x="1.5" y="1.5" width="7" height="7" /></svg>
            <svg class="icon-restore" viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><rect x="2.5" y="0.5" width="7" height="7" /><rect x="0.5" y="2.5" width="7" height="7" /></svg>
          </button>
          <button type="button" class="win-btn win-btn-close" id="win-close" title="关闭" aria-label="关闭">
            <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M2 2l6 6M8 2l-6 6" /></svg>
          </button>
        </div>
      </div>

      <div class="workspace">
        <header class="head">
          <ft-toolbar id="toolbar"></ft-toolbar>
          <span class="toolbar-divider" id="balance-divider" hidden aria-hidden="true"></span>
          <span class="balance-wrap" id="balance-wrap" hidden>
            <wa-tag id="balance" variant="brand" size="s">余额</wa-tag>
            <span class="progress-line balance-progress" id="balance-progress" hidden>
              <span class="progress-line-runner"></span>
            </span>
          </span>
        </header>

        <script src="/boot-body.js"></script>

        <ft-settings-sheet id="settings-sheet"></ft-settings-sheet>

  <ft-terms id="terms"></ft-terms>

  <ft-size-badge></ft-size-badge>
  


        <main class="grid">
          <section class="col">
            <ft-source-card id="source-card"></ft-source-card>

            <button type="button" class="terms-trigger" id="terms-trigger">
              <span class="terms-badge"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7.2V3.5a1 1 0 0 1 1-1h3.7a1 1 0 0 1 .7.3l5.3 5.3a1 1 0 0 1 0 1.4l-3.7 3.7a1 1 0 0 1-1.4 0L2.8 7.9a1 1 0 0 1-.3-.7z" /><circle cx="5.6" cy="5.6" r=".9" /></svg></span>
              <span class="terms-label" id="terms-label">术语 0 条</span>
              <span class="terms-go">管理 ›</span>
            </button>
            
          </section>

          <section class="col">
            <ft-output-card id="output-card"></ft-output-card>
          </section>
        </main>

        

        <div class="mobile-bar" id="mobile-bar">
          <button type="button" class="mobile-btn" id="mobile-image" title="图片翻译" aria-label="图片翻译">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" /><circle cx="9" cy="10" r="1.6" /><path d="m5 18 5-5 3 3 3-3 4 4" /></svg>
          </button>
          <button type="button" class="mobile-btn" id="mobile-terms">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7.2V3.5a1 1 0 0 1 1-1h3.7a1 1 0 0 1 .7.3l5.3 5.3a1 1 0 0 1 0 1.4l-3.7 3.7a1 1 0 0 1-1.4 0L2.8 7.9a1 1 0 0 1-.3-.7z" /><circle cx="5.6" cy="5.6" r=".9" /></svg>
            <span id="mobile-terms-label">术语 0</span>
          </button>
          <button type="button" class="mobile-btn primary" id="mobile-translate">翻译</button>
        </div>
      </div>
    </div>

    <wa-dialog id="confirm-modal" label="清空术语">
      <div>确定要清空全部已添加的术语吗？清空后无法恢复。</div>
      <div slot="footer" class="dialog-actions">
        <wa-button id="confirm-cancel" appearance="plain">取消</wa-button>
        <wa-button id="confirm-ok" variant="danger">清空</wa-button>
      </div>
    </wa-dialog>

    <ft-verify-dialog id="verify-dialog"></ft-verify-dialog>

    <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

    <script type="module" src="/app.js"></script>
    <div class="ctx-menu" id="ctx-menu" role="menu" aria-label="上下文菜单" hidden></div>
  
  <ft-model-picker id="model-picker"></ft-model-picker>
  <ft-theme-picker id="theme-picker"></ft-theme-picker>

  <ft-balance-dialog id="balance-dialog"></ft-balance-dialog>
</body>
</html>
